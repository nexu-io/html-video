spec_version: 1
id: frame-luxe-minimal
name: Luxe Minimal
description: >
  Luxury-minimal whitespace hero — a single word reveals letter by letter in ultra-thin
  Inter, a warm-gold hairline extends, thin indicators rise and breathe. Calm, premium,
  70%+ whitespace. Distilled from the huashu-design luxury-minimal showcase
  (L1 inspiration recorded in provenance.origin only).

engine: hyperframes
engine_version: ^0.4.0
source_entry: source/index.html

category: presentation
subcategory: hero
tags: [minimal, luxury, whitespace, hero, gold, thin, luxe]

best_for:
  - "Premium product / brand hero"
  - "Calm single-word statement"
  - "Elegant title card"

output:
  formats: [mp4, webm]
  default_format: mp4
  resolution:
    default: { width: 1920, height: 1080 }
    supported_aspects: ["16:9", "1:1"]
  fps:
    default: 60
    supported: [30, 60]
  duration:
    type: variable
    min_sec: 4
    max_sec: 7
  alpha: false
  audio:
    supported: true
    expected_inputs: [bgm]

inputs:
  schema:
    type: object
    required: [hero]
    properties:
      eyebrow:
        type: "string"
        maxLength: 40
        description: "Tiny uppercase eyebrow above the hero word"
      hero:
        type: "string"
        maxLength: 16
        description: "The single hero word, revealed letter by letter"
      desc:
        type: "string"
        maxLength: 140
        description: "Two short centered lines under the gold rule"
      duration_sec:
        type: "number"
        minimum: 4
        maximum: 7
        default: 5
  examples:
    - {"eyebrow": "HTML → Video", "hero": "Local", "desc": "One agent loop. Real MP4 on your laptop. No per-clip fee."}

license:
  spdx: Apache-2.0
  attribution_required: true
  redistribution_allowed: true
  commercial_use: true

provenance:
  origin:
    name: Build
    kind: design-studio
    reference: "London branding studio — luxury minimalism, ultra-thin type, generous whitespace"
  via_skill:
    name: huashu-design
    author: "alchaincyf (花叔 · 花生)"
    url: https://github.com/alchaincyf/huashu-design
    license: MIT
    source_file: assets/showcases/ppt/ppt-build.html
  transformation: >
    Static PPT showcase → animated hyperframes timeline (hero word reveals letter by
    letter in ultra-thin Inter, #D4A574 gold hairline extends, thin indicators rise and
    breathe) built as original CSS keyframes. Re-typed for motion; sample copy replaced
    with html-video messaging. No upstream source code copied verbatim. Template id uses
    a neutral design-feature name (RFC-07 §③).

author:
  name: nexu-io
  url: https://github.com/nexu-io
  contact: open-design@nexu.io

version: 0.2.0
changelog:
  - version: 0.2.0
    date: 2026-08-05
    notes: Renamed id to frame-luxe-minimal (RFC-07); refreshed sample copy.
  - version: 0.1.0
    date: 2026-06-03
    notes: Distilled from huashu-design luxury-minimal showcase into an animated html-video template.

preview:
  poster: preview.png

performance:
  reference_render:
    duration_sec: 5
    render_wall_clock_sec: 10
    machine: "M2 MacBook Air"
