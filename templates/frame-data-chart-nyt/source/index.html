<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>NYT Chart · AI Agent MAU 2018–2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { font-family:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif; background:#f7f5ee; color:#1a1a1a; margin:0; }
  .serif { font-family:'Source Serif Pro',Georgia,serif; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .nyt-red { color:#a91d1d; }
  .nyt-red-fill { fill:#a91d1d; }
  .kicker { font-size:11px; letter-spacing:0.14em; text-transform:uppercase; }
  @keyframes draw { from { stroke-dashoffset: 1000 } to { stroke-dashoffset: 0 } }
  .line { stroke-dasharray:1000; animation: draw 1.4s ease-out forwards; animation-delay: .4s; opacity:0; animation-fill-mode: forwards; }
  .line { animation: draw 1.4s ease-out .4s forwards, fadeIn .1s linear .4s forwards; }
  @keyframes fadeIn { to { opacity:1 } }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-12">
  <article class="w-[1280px] max-w-full">
    <header class="flex items-baseline justify-between">
      <div class="kicker nyt-red font-semibold">GLOBAL · MONTHLY ACTIVE USERS · 2018–2026</div>
      <div class="kicker opacity-60 mono">FRAME 04 · CHART</div>
    </header>

    <h1 class="serif mt-3 leading-[1.05] font-medium" style="font-size:clamp(36px,4.4vw,68px)" id="hv-title">
      {{title}}
    </h1>

    <!-- chart rendered by JS using window.__HV_VARS__.data -->
    <svg viewBox="0 0 1100 460" class="mt-8 w-full" id="hv-chart">
      <!-- y axis hairlines -->
      <g stroke="#1a1a1a" stroke-width="0.5" opacity="0.25">
        <line x1="60" y1="60" x2="1040" y2="60"/>
        <line x1="60" y1="180" x2="1040" y2="180"/>
        <line x1="60" y1="300" x2="1040" y2="300"/>
        <line x1="60" y1="420" x2="1040" y2="420"/>
      </g>
    </svg>

    <footer class="mt-3 flex items-baseline justify-between mono text-[10.5px] opacity-60">
      <span>{{subtitle}}</span>
      <span>NYT-STYLE · FRAME-DATA-CHART-NYT</span>
    </footer>
  </article>

  <script>
  (function() {
    var vars = window.__HV_VARS__ || {};
    var data = vars.data || [];
    if (!data.length) return;
    var svg = document.getElementById('hv-chart');
    var ns = 'http://www.w3.org/2000/svg';
    var maxVal = Math.max.apply(null, data.map(function(d){ return d.value; }));
    var chartLeft = 60, chartRight = 1040, chartTop = 60, chartBottom = 420;
    var chartW = chartRight - chartLeft;
    var chartH = chartBottom - chartTop;
    var n = data.length;
    var step = chartW / (n - 1 || 1);
    var points = data.map(function(d, i) {
      var x = chartLeft + i * step;
      var y = chartBottom - (d.value / maxVal) * chartH;
      return { x: x, y: y, d: d };
    });
    // area
    var areaPath = 'M ' + points.map(function(p){ return p.x + ' ' + p.y; }).join(' L ');
    areaPath += ' L ' + points[points.length-1].x + ' ' + chartBottom + ' L ' + chartLeft + ' ' + chartBottom + ' Z';
    var area = document.createElementNS(ns, 'path');
    area.setAttribute('d', areaPath);
    area.setAttribute('fill', '#a91d1d');
    area.setAttribute('opacity', '0.06');
    svg.appendChild(area);
    // line
    var polyline = document.createElementNS(ns, 'polyline');
    polyline.setAttribute('class', 'line');
    polyline.setAttribute('fill', 'none');
    polyline.setAttribute('stroke', '#1a1a1a');
    polyline.setAttribute('stroke-width', '2.5');
    polyline.setAttribute('stroke-linejoin', 'round');
    polyline.setAttribute('stroke-linecap', 'round');
    polyline.setAttribute('points', points.map(function(p){ return p.x + ',' + p.y; }).join(' '));
    svg.appendChild(polyline);
    // dots + x labels
    points.forEach(function(p) {
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', p.x);
      c.setAttribute('cy', p.y);
      c.setAttribute('r', '4');
      c.setAttribute('fill', '#1a1a1a');
      svg.appendChild(c);
      var t = document.createElementNS(ns, 'text');
      t.setAttribute('x', p.x);
      t.setAttribute('y', '445');
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '11');
      t.setAttribute('fill', '#1a1a1a');
      t.setAttribute('opacity', '0.6');
      t.setAttribute('class', 'mono');
      t.textContent = p.d.label;
      svg.appendChild(t);
    });
    // y max label
    var yMax = document.createElementNS(ns, 'text');
    yMax.setAttribute('x', '20');
    yMax.setAttribute('y', '64');
    yMax.setAttribute('font-size', '11');
    yMax.setAttribute('fill', '#1a1a1a');
    yMax.setAttribute('opacity', '0.6');
    yMax.setAttribute('class', 'mono');
    yMax.textContent = maxVal;
    svg.appendChild(yMax);
  })();
  </script>
</body>
</html>
